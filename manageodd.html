<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Candidate - Front End Developer</title>
    <link rel="stylesheet" href="css/manageodd.css" />
  </head>
  <body>
    <header class="navbar">
      <div class="breadcrumbs">
        <button class="btn">Job list</button> <span class="arrow">›</span>
        <button class="btn active">Manage Candidate</button>
      </div>
      <div class="user-avatar">
        <img src="img/img2.jpg" alt="User avatar" />
      </div>
    </header>
    <main class="content">
      <h2 class="job-title">Front End Developer</h2>
      <section class="candidate-box">
        <div class="empty-state">
          <img src="img/img4.jpg" alt="No candidates" class="empty-img" />
          <h3>No candidates found</h3>
          <p>Share your job vacancies so that more candidates will apply.</p>
        </div>
      </section>
    </main>
    <script src="js/manageodd.js"></script>
  </body>
</html>
